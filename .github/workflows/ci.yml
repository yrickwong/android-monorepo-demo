name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for affected-modules / docs-sync / git diff

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 0. Enforce the docs-sync contract (AGENTS.md § Rule 0).
      #    Runs first: cheap, surfaces design/doc drift before we waste
      #    minutes on a build. Rules live in tools/docs-sync/docs-sync-rules.json.
      - name: Check docs sync
        run: |
          # On PRs, diff against the merge base; on push to main, diff against HEAD~1.
          if [ -n "$GITHUB_BASE_REF" ]; then
            BASE="origin/$GITHUB_BASE_REF"
            git fetch --no-tags --depth=50 origin "$GITHUB_BASE_REF" || true
          else
            BASE="HEAD~1"
          fi
          python3 tools/docs-sync/check_docs_sync.py --base "$BASE" --strict

      # 1. Enforce architecture layer boundaries.
      - name: Check dependency rules
        run: ./gradlew checkDependencyRules --no-daemon

      # 2. Generate the dependency graph (json/dot/html) into docs/.
      - name: Generate dependency graph
        run: ./gradlew generateDependencyGraph --no-daemon

      # 3. Full debug build.
      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload dependency graph
        uses: actions/upload-artifact@v4
        with:
          name: dependency-graph
          path: docs/dependency-graph.*

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
